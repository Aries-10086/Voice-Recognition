# ============================================================
# 系统默认配置文件
# ============================================================

system:
  name: "CrossLingualVoiceClone"
  version: "1.0.0"
  device: "cuda"  # cuda / cpu
  seed: 42
  output_dir: "./outputs"
  model_dir: "./models"  # 跨平台项目内缓存; Windows 可改为 D:/CodingPackage/models

# ---------- ASR 语音识别 ----------
asr:
  engine: "faster_whisper"        # 清唱实测 Whisper > FunASR；说话也可用
  model_name: "medium"            # CPU 友好; GPU 可改 large-v3
  compute_type: "int8"
  device: "cpu"                   # cuda / cpu (run_pipeline --device 会覆盖)
  beam_size: 3                    # 真实样例提准; 演示可改回 1 加速
  num_workers: 1                  # 传给 WhisperModel 构造函数 (GPU 建议 1)
  cpu_threads: 0                  # CPU 推理线程数 (0=自动)
  language: "zh"
  word_timestamps: true
  condition_on_previous_text: false
  temperature: 0.0
  # 领域提示: 只声明场景, 不要写具体主题句 (否则弱音/嘈杂时 Whisper 会整段复读提示词)
  # 反例: 「讨论科技、气候、河流与历史」曾导致千夏等人声被幻觉成该句循环
  initial_prompt: "这是一段中文口语对话，请准确转写说话内容。"
  # S1/G2: prompt 三档 (neutral | singing | fleurs_dialog)
  prompt_profile: neutral
  prompt_profiles: {}   # 可覆盖内置 singing 参数
  # 真 ASR 通过线（无歌词 hint）
  singing_pass_keyword_rate: 0.70
  singing_pass_bigram: 0.35
  hallucination_guard:
    enabled: true
    overlap_threshold: 0.45
    banned_phrases:
      - "讨论科技、气候、河流与历史"
      - "讨论科技、气候、河流"
      - "科技、气候、河流与历史"
  vad_filter: true
  min_silence_ms: 250             # VAD 静音阈值, 越小切段越碎
  speech_pad_ms: 120
  # 二次切段 (双人对话关键): 按词间静音/能量/最大时长再切
  split_silence_seconds: 0.32
  max_segment_seconds: 2.8
  min_segment_seconds: 0.45
  # 碎句合并: 修复「還分|太清」「把說|話人」等半句切开
  # O1 (2026-08-31): 略放宽 — 歌词/口述碎段 (如 "ory"/"CD我的") 更易粘合再译
  merge_gap_seconds: 0.50
  merge_max_seconds: 4.8
  merge_short_chars: 12
  # 超短碎屑 (纯英文尾巴/残片) 强制并入前一段的最大字数
  crumb_max_chars: 4
  # ASR 后校正 (明确误识对)
  corrections:
    - ["水保护", "水管"]
    - ["水保護", "水管"]
    - ["不可预测的风景", "不可预测的气候"]
    - ["不可預測的風景", "不可预测的气候"]
  hotwords: ["说话人分离", "语音克隆", "水管", "气候"]
  # 清唱常见误识对 (P1 · 如果爱忘了样例)
  singing_corrections:
    - ["想爱过", "如果爱忘了"]
    - ["如果是爱了", "要是忘了"]
    - ["分开月灯", "分开的话"]
    - ["加你的发", "你的发"]
    - ["加你的", "你的"]
    - ["想遇个不了", "相遇不了"]
    - ["想遇个", "相遇"]
    - ["一硬地动", "隐隐地震"]
    - ["在那个时间", "在那个瞬间"]
    - ["必须要处理", "必须要坚强"]
    - ["已没家", "已没有家"]
    - ["淚不剩落下", "泪不想落下"]
    - ["泪不剩落下", "泪不想落下"]
    - ["幸福提升大家", "幸福啊 让她给我吧"]
    - ["根本吸不掉", "根本洗不掉"]
  lexicon_broadcast: "data/lexicon_broadcast.txt"
  # FunASR 配置
  funasr_model: "iic/SenseVoiceSmall"
  # 清唱对比建议关闭（避免额外下载大模型）; 对白需要时可开
  vad_model: null
  punc_model: null
  # 可选本地路径（SenseVoice 已下时优先）:
  # funasr_model: "/Users/mac/.cache/modelscope/models/iic--SenseVoiceSmall/snapshots/master"

# ---------- 语种识别 ----------
language_id:
  model_name: "facebook/mms-lid-4017"

# ---------- 情感识别 ----------
emotion:
  engine: "emotion2vec"     # emotion2vec / speechbrain / wav2vec2_emotion
  model_name: "iic/emotion2vec_base_finetuned"
  wav2vec2_model: "superb/wav2vec2-base-superb-er"  # emotion2vec 不可用时的回退模型
  # 情感类别映射
  categories: ["neutral", "happy", "sad", "angry", "surprised", "fearful", "disgusted"]
  embedding_dim: 768

# ---------- LLM 翻译优化 ----------
translation:
  engine: "google"           # google / local / openai_compatible / auto
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  api_base: "http://localhost:8000/v1"
  temperature: 0.3
  max_tokens: 512
  emotion_weight: 0.3
  cache_dir: "./models/huggingface/hub"
  # C4 歌词英文硬伤修复 (regex → replacement)
  singing_glossary:
    - ["\\bthose happiness\\b", "those happy times"]
    - ["\\bseparate the moonlight\\b", "time to say goodbye"]
  # F4: 音节长度比约束 (目标/源)
  length_ratio_min: 0.8
  length_ratio_max: 1.15          # 略收紧, 避免段级贴边汇总后 >1.2

# ---------- 发音开闭感知 & 时间轴对齐 ----------
alignment:
  # AOCP-Net 创新模块配置
  aocp:
    sample_rate: 16000
    window_size_ms: 25
    hop_size_ms: 10
    n_mels: 80
    n_mfcc: 40
    # 多尺度特征提取
    multi_scale_windows: [20, 50, 100]  # ms
    # 模型结构
    encoder_dim: 256
    lstm_layers: 3
    lstm_hidden: 512
    attention_heads: 8
    dropout: 0.1
    # 预训练权重路径; 为空则强制能量 VAD (O7)
    checkpoint: null
  # 音素对齐
  phoneme:
    use_phonemizer: true
    ctc_beam_size: 10
  # 动态时间规整
  dtw:
    radius: 30  # Sakoe-Chiba band radius
  # 口型同步评分 (O7 / C1)
  sync:
    target_score: 0.65

# ---------- 语音合成与声纹复刻 ----------
synthesis:
  # auto: 自动选择最优可用引擎  CosyVoice2(更优克隆) → Qwen3-TTS → edge-tts
  engine: "qwen3_tts"
  # P0-B1: 演示时建议 true, 禁止静默落到 edge-tts (无真克隆)
  require_clone_engine: true
  allow_edge_fallback: true
  qwen3_tts:
    # F5 (2026-08-28): Mac/MPS 实测对比见 outputs/f5_compare/report.md
    # 0.6B: load≈14s clone≈10s mfcc_sim≈0.994 — 默认保速
    # 1.7B: load≈19s clone≈13s mfcc_sim≈0.986 — 像度代理未优于 0.6B, 略慢
    # 若 GPU/听感 MOS 明显更好可改: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    # (注: CustomVoice 不支持 generate_voice_clone, 只能预设音色)
    model_name: "Qwen/Qwen3-TTS-12Hz-0.6B-Base"
    sample_rate: 24000
    # 备选: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
  cosyvoice2:
    # 更优的零样本跨语种克隆模型 (需先下载权重, 见 README)
    # Mac/跨平台: 优先用项目内 ./models/ ; Windows 可改绝对路径
    code_dir: "./models/CosyVoice2-0.5B"
    pretrained_dir: "./models/cosyvoice2_pretrained"
    sample_rate: 24000
  emotion_injection: true
  vocoder: "builtin"
  # 生成参数 (Qwen3-TTS)
  gen:
    max_new_tokens: 2048
    repetition_penalty: 1.1
    top_p: 0.95
    top_k: 50

# ---------- Pipeline 集成 ----------
pipeline:
  # 流程步骤
  steps:
    - asr
    - emotion_recognition
    - translation
    - aocp_analysis
    - phoneme_alignment
    - timeline_generation
    - voice_synthesis
  # 输出格式
  output_format: "wav"
  # 是否保留中间结果
  keep_intermediate: true

  # 说话人分离 (识别不同人声) — P0 调优
  diarization:
    engine: "auto"              # pyannote / wav2vec2_cluster / auto(自动回退)
    max_speakers: 8
    min_speakers: 1
    expected_speakers: 2        # 对白验收: 段数足够时至少拆成 2 人; 独白改为 1
    assume_single_speaker: false  # 清唱模式可自动开启 (见 singing 块)
    # 越小分得越细
    distance_threshold: 0.40
    retry_split_min_segments: 2 # 段数≥此值且人数不足时期望二次拆分
    allow_single_speaker: true  # false=多人预期却分不出则直接报错
    fallback_on_pyannote_fail: true
    embedding: "spectral"       # spectral(推荐)/wav2vec2 — 勿用情感嵌入做分人
    prefer_f0: true             # 双人优先 F0 高低音二分
    f0_min_spread_hz: 12.0     # F0 高低差阈值 (Hz); 合成音可略降
    refine_by_embedding: true   # F2: KMeans 段级重标 + label_confidence
    turn_taking_correct: true   # O3: 静音轮次 + 交替校正
    turn_gap_seconds: 0.35      # 超过该静音视为换人话轮

  # S1: 清唱模式默认行为 (prompt_profile=singing 时生效)
  singing:
    assume_single_speaker: true
    expected_speakers: 1
    domain: singing
    default_emotion: sad
    min_group_segments: 1
    prefer_early_reference: true
    merge_lyrics_translate: true
    # 真 ASR KPI：CLI --no-lyrics-hint / --generic-asr-refine

  # G3: 质量门禁
  quality:
    length_ratio_min_success: 0.8
    length_ratio_max_success: 1.15
    min_per_seg_translate_ratio: 0.95

  # 分段合成 (整段克隆 + 停顿控制)
  segment:
    onset_pad: 0.05             # 起始音/结束音边界向外扩展(秒)
    energy_threshold_ratio: 0.25  # 起止音能量阈值(相对帧能量峰值)
    fade_ms: 12                 # 单段首尾淡化(去咔哒声)
    crossfade_ms: 25            # 组内相邻块交叉淡化(毫秒), 使连接更顺滑
    min_gap: 0.08               # 组间最小静音(秒)
    reference_min_seconds: 2.0  # 语音样本最短时长(秒)
    reference_max_seconds: 8.0  # 语音样本最长时长(秒)
    min_group_segments: 2       # 少于该段数的语气波动组并回上一组(去噪)
    emotion_bucket: true        # 情感粗分桶, 减少抖动误切组
    chunk_max_chars: 250        # 整段话切块的最大字符数 (避免长句生成中断)
    chunk_max_sentences: 3      # 整段话切块的最大句数
    # F4: 合成时长对齐源语 (±20%)
    # O3 (2026-08-31): 下限 0.90 — 译文偏短时整轨上拉, 避免 0.82 级明显缩水
    match_group_duration: true  # 每组克隆后 time-stretch 到源组覆盖时长
    match_output_duration: true # 整轨输出压到源时长的 0.9–1.2 倍
    duration_ratio_min: 0.90
    duration_ratio_max: 1.2
    # F6: 组间停顿对齐源语静音
    align_source_gaps: true
    max_gap: 0.8                # 组间静音上限(秒)
